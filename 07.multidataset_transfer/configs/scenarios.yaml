scenarios:
  ccle_tmt_to_itraq_labelfree:
    train: [CCLE, TMT]
    test: [iTRAQ, LabelFree]
    description: "Train once on CCLE + TMT and evaluate independently on iTRAQ and LabelFree."

  ccle_tmt_itraq_to_labelfree:
    train: [CCLE, TMT, iTRAQ]
    test: [LabelFree]
    description: "Leave LabelFree out."

  ccle_tmt_labelfree_to_itraq:
    train: [CCLE, TMT, LabelFree]
    test: [iTRAQ]
    description: "Leave iTRAQ out."

  ccle_labelfree_itraq_to_tmt:
    train: [CCLE, LabelFree, iTRAQ]
    test: [TMT]
    description: "Leave TMT out."
